# config/tag-rules.yml
# Canonical source of truth for the Tag Engine v2 tag taxonomy.
#
# Generated from stash_rules_engine.py (Tier A hardcoded mappings).
# This file is the single source of truth; the rules engine loads from it.
#
# Normalization (matches _normalize_tag in the engine):
#   raw tags are matched case-insensitively after strip() + lower() + rstrip(',').
#   All keys below are already stored lowercase to match lookup semantics.
#
# Collision policy:
#   - A raw tag may map to at most ONE structured tag across `axes`.
#   - A raw tag in `axes` MUST NOT also appear in `detail_tags` (would be dead).
#   - `blacklist` is a removal filter, NOT a mapping destination; it is checked
#     FIRST in map_tag and takes precedence over any axis mapping. A handful of
#     tags intentionally appear in both blacklist and an axis (e.g. 'hardcore'):
#     the blacklist wins at runtime; the axis entry documents original intent.
#   - DETAIL_TAGS that collided with axes (13 entries) were removed from
#     `detail_tags`; their canonical home is the axis (more specific).

version: 2

# Axis name -> tag prefix string. Computed axes (CAST/DEMO/AGE/ERA/STUDIO) have
# no rule dicts but still declare a prefix here for is_structured_tag().
