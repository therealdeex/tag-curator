name: __PLUGIN_NAME__
description: A guarded Scene.Update.Post hook plugin.
version: 0.1.0
url: https://example.invalid/__PLUGIN_ID__

exec:
  - python3
  - "{pluginDir}/plugin.py"
interface: raw
errLog: error

hooks:
  - name: Process scene updates
    description: Runs after a scene update and skips irrelevant fields.
    triggeredBy:
      - Scene.Update.Post
    defaultArgs:
      mode: hook
      enabled: "true"
      dryRun: "true"
