# stash-tag-curator/config/default-tag-rules.yml
# Canonical source of truth for the Tag Engine v3 tag taxonomy.
#
# Bundled immutable default. On first run the engine copies this file to
# <data-dir>/tag-rules.yml; the active copy is the source of truth thereafter.
#
# Schema (v3):
#   version        - schema version (3)
#   prefixes       - 12 axis -> prefix strings (CAST/DEMO/AGE/ERA/STUDIO are
#                    computed; ACT/BODY/THEME/SET/WARD/KINK/PROD are mapped)
#   canonical_tags - axis -> list of canonical tag names (computed axes are
#                    empty: their labels are generated from the finite
#                    `derived` bucket sets, never enumerated here)
#   mappings       - normalized source key -> {outputs, disposition, notes}
#                    disposition is one of: map | detail | ignore | defer
#                    * map    -> outputs REQUIRED (>=1 canonical tag)
#                    * detail -> outputs REQUIRED (>=1 unprefixed pass-through)
#                    * ignore -> outputs FORBIDDEN (noise; dropped)
#                    * defer  -> outputs carry the v2 destination for audit;
#                                the mapping is NOT active until a human review
#                    map and ignore are mutually exclusive. No silently
#                    unreachable rules (v2 blacklist-wins collisions resolved).
#   derived        - finite, bounded bucket sets + alias tables for computed
#                    axes (age/height/weight/ethnicity/country/cast/era)
#   protected      - prefixes/tag_names always preserved on a scene
#   legacy         - v1 prefixes/checkpoint/suffix markers for cleanup
#
# Normalization (applied to source keys): strip().lower().rstrip(',').
# Internal whitespace is NOT collapsed. No substring fuzzy matching.
#
# Migrated from the root-level v2 tag-rules.yml with zero data loss: every
# v2-mapped destination, every detail tag, and every blacklist entry is
# represented below. The 7 mapped/blacklist collisions and the ~30 flagged
# mis-mappings are resolved explicitly (see their notes).
