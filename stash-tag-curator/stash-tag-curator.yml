name: "Stash Tag Curator"
description: >-
  Plugin that translates provider tags into your taxonomy via an editable
  tag dictionary, fills missing scene metadata, and keeps the library
  up to date. One button: Update Library — idempotent, resumable, and
  self-repairing by re-running. Targets Stash v0.31.1.
version: 0.5.0
url: https://example.invalid/stash-tag-curator

exec:
  - python3
  - "{pluginDir}/curator/main.py"
interface: raw
errLog: error

ui:
  javascript:
    - ui/index.js
  css:
    - ui/styles.css
  assets:
    /: assets

settings:
  stash_api_key:
    displayName: Stash API Key
    description: >-
      API key used for authenticated local GraphQL calls when Stash requires
      one. Leave blank for unauthenticated localhost setups.
    type: STRING
  default_provider_batch_size:
    displayName: Provider Batch Size
    description: >-
      Number of scenes sent to each provider lookup per request.
    type: STRING
  strict_version:
    displayName: Strict Version Check
    description: >-
      When true, the engine refuses to run against mismatched rule-schema
      versions.
    type: STRING
  enabled_providers:
    displayName: Enabled Providers
    description: >-
      Comma-separated list of provider keys used during enrichment
      (e.g. stashdb,tpdb).
    type: STRING
  preserve_protected:
    displayName: Preserve Protected Tags
    description: >-
      When true, tags whose labels start with a protected prefix (e.g.
      MANUAL:) are never removed by cleanup or rebuild.
    type: STRING
  provider_priority:
    displayName: Provider Priority
    description: >-
      Comma-separated provider tokens in priority order (highest first), e.g.
      "stashdb,tpdb". When empty, provider discovery order is used. Used for
      metadata-field merge tie-breaking.
    type: STRING
  max_performer_creates_per_run:
    displayName: Max Performer Creates Per Run
    description: >-
      Maximum number of new performers the curator may create in a single run.
      Entity creation aborts before the first create if this cap is exceeded.
    type: NUMBER
  max_studio_creates_per_run:
    displayName: Max Studio Creates Per Run
    description: >-
      Maximum number of new studios the curator may create in a single run.
    type: NUMBER
  generate_previews:
    displayName: Generate Previews
    description: >-
      Generate video previews during the dashboard's Generate step (before
      Update Library).
    type: BOOLEAN
  generate_image_previews:
    displayName: Generate Image Previews
    description: >-
      Generate animated image previews during the dashboard's Generate step.
    type: BOOLEAN
  generate_phashes:
    displayName: Generate Perceptual Hashes
    description: >-
      Generate video perceptual hashes (phashes) during the dashboard's
      Generate step.
    type: BOOLEAN

tasks:
  - name: Update Library
    description: >-
      The one maintenance workflow: identifies scenes via stash-box, applies
      the dictionary, fills missing scene metadata, creates missing
      performers/studios (capped), enriches from performer metadata, removes
      orphaned plugin tags, and retries prior failures. Idempotent and
      resumable: interrupted runs continue next time. Requires confirmation
      from the dashboard; running it from the Tasks page is a safe no-op.
    defaultArgs:
      task: CurateLibrary
      confirmed: "false"
  - name: Preview Update Library
    description: >-
      Simulate Update Library across every scene phase and report what would
      change without writing anything to Stash.
    defaultArgs:
      task: CurateLibrary
      preview: "true"
  - name: Save Dictionary Edit
    description: >-
      Persist a dictionary edit performed via the dashboard to the active
      rules file and re-validate it.
    defaultArgs:
      task: SaveMapping
  - name: Validate Dictionary
    description: >-
      Validate the active dictionary file against the JSON schema and report
      any violations without running the engine.
    defaultArgs:
      task: ValidateRules
  - name: Preflight
    description: >-
      Run connectivity, configuration, and rule checks before starting a long
      run.
    defaultArgs:
      task: Preflight
  - name: Refresh Data
    description: >-
      Regenerate every dashboard snapshot (status, dictionary, run history,
      rules audit) in one read-only pass.
    defaultArgs:
      task: RefreshData
  - name: Run Detail
    description: >-
      Report exactly what one prior run changed (per-scene tag diffs). Pass
      the run_id arg; the dashboard does this automatically.
    defaultArgs:
      task: RunDetail
